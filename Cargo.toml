[package]
name = "batch-rename"
version = "0.1.1"
edition = "2021"
description = "A safe regex/template batch file renamer (dry-run by default)"
license = "MIT"
authors = ["smolkai <smolkai@users.noreply.github.com>"]
readme = "README.md"

[[bin]]
name = "batch-rename"
path = "src/main.rs"

[lib]
name = "batch_rename"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
regex = "1"
anyhow = "1"
walkdir = "2"
glob = "0.3"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
